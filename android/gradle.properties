# Brew's gradle runs on JDK 26 and no Android Gradle Plugin supports that yet.
# Pin the toolchain to the JDK 21 already installed on this machine.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-21.jdk/Contents/Home
org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official
